<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pelican Companion – Stardew Valley Wiki &amp; Farm Dashboard</title>
<meta name="description" content="A personalized Stardew Valley companion: wiki database, farm dashboard, seasonal calendar, progress tracker and goals. Your save never leaves your device.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Nunito:wght@400;600;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<a class="skip" href="#main">Skip to content</a>
<header id="topbar">
  <button id="menuBtn" aria-label="Menu" class="px-btn">☰</button>
  <a href="#/" class="brand"><span class="brand-ico">🌻</span><span class="brand-txt">Pelican<br>Companion</span></a>
  <div id="searchWrap" role="search">
    <input id="searchBox" type="search" placeholder="Search fish, villagers, crops, recipes…  ( / )" autocomplete="off" aria-label="Global search">
    <div id="suggest" hidden></div>
  </div>
  <div id="farmPick"></div>
</header>
<div id="layout">
  <nav id="sidenav" aria-label="Main"></nav>
  <main id="main" tabindex="-1"></main>
</div>
<div id="modalRoot"></div>
<div id="toast" role="status"></div>

<script src="js/search.js"></script>
<script src="js/views/wiki.js"></script>
<script src="js/views/dashboard.js"></script>
<script src="js/views/calendar.js"></script>
<script src="js/views/tracker.js"></script>
